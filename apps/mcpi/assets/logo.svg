<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- mcpi — the contract as three diagonal bands (MCP serpentine echo); one band slipped -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191d27"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <clipPath id="b1"><polygon points="0,0 448,0 0,448"/></clipPath>
    <clipPath id="b2"><polygon points="472,0 552,0 0,552 0,472"/></clipPath>
    <clipPath id="b3"><polygon points="576,0 1024,0 1024,1024 0,1024 0,576"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <g clip-path="url(#b1)">
    <rect x="134" y="134" width="244" height="244" rx="44" fill="#e6edf3"/>
  </g>
  <g clip-path="url(#b2)">
    <rect x="150" y="150" width="244" height="244" rx="44" fill="#3cc4dc"/>
  </g>
  <g clip-path="url(#b3)">
    <rect x="134" y="134" width="244" height="244" rx="44" fill="#e6edf3"/>
  </g>
</svg>
