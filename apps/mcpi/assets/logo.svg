<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- mcpi — the probe dot: the wordmark's i, its tittle a pinging status dot
       (the directory's `success` green, emerald-400) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191d27"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <path d="M256,258 V414" fill="none" stroke="#e6edf3" stroke-width="56" stroke-linecap="round"/>
  <circle cx="256" cy="158" r="42" fill="#34d399"/>
  <circle cx="256" cy="158" r="86" fill="none" stroke="#34d399" stroke-width="22"
          stroke-linecap="round" stroke-dasharray="330 210" transform="rotate(160 256 158)"/>
</svg>
