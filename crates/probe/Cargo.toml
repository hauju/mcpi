[package]
name = "probe"
description = "Diagnoses an MCP endpoint over plain HTTP: what it is, how it authenticates, and what can connect to it."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# See the note in crates/mcpclient/Cargo.toml: rmcp's feature does not enable a
# TLS backend, and every real MCP server is https. Declared explicitly here too
# because this crate talks to servers directly rather than through rmcp.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }
url = "2.5"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
